<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: blob:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'">
<title>Painel | Achadinhos</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<noscript><p style="padding:20px">Ative o JavaScript para acessar o painel.</p></noscript>
<header><div class="wrap bar"><a class="logo" href="./">achadi<b>nhos</b></a><span class="sp"></span>
<span class="count hide-m" id="who"></span><button class="ibtn" id="out" type="button">Sair</button></div></header>
<main class="wrap" id="app" hidden>
<section><h2>Produtos</h2>
<div class="tools"><button class="ibtn" id="imp" type="button">Importar JSON</button><button class="ibtn" id="exp" type="button">Baixar produtos.json</button><input type="file" id="file" accept="application/json" hidden><span class="count">As alterações são salvas direto no banco, protegidas por login.</span></div>
<div class="adm">
<form id="form" autocomplete="off"><h2 id="ft">Novo produto</h2>
<label>Nome<input class="fld" name="nome" required maxlength="140"></label>
<label>Loja<select class="fld" name="loja"><option>SHEIN</option><option>Shopee</option><option>TikTok Shop</option></select></label>
<label>Gênero<select class="fld" name="genero"><option>Masculino</option><option>Feminino</option></select></label>
<label>Categoria<input class="fld" name="categoria" required list="cl" maxlength="40"></label><datalist id="cl"></datalist>
<label>Preço (R$)<input class="fld" name="preco" type="number" step="0.01" min="0.01" required></label>
<label>Preço antigo (R$, opcional)<input class="fld" name="precoAntigo" type="number" step="0.01" min="0"></label>
<label>Vendidos (opcional)<input class="fld" name="vendidos" maxlength="60" placeholder="5mil+ vendidos"></label>
<label>Imagem (caminho ou https://)<input class="fld" name="imagem" required placeholder="imagens/p53.jpg"></label>
<label>Link de afiliado (https://)<input class="fld" name="link" type="url" required></label>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="destaque"> Mostrar em destaques</label>
<div class="err" id="err" role="alert"></div>
<div><button class="ibtn on" type="submit">Salvar produto</button> <button class="ibtn" type="button" id="cancel" hidden>Cancelar</button></div>
</form>
<div><div class="tools"><input class="fld" id="aq" type="search" placeholder="Filtrar lista…" style="flex:1"><span class="count" id="ac"></span></div><div id="list"></div></div>
</div></section>
<section id="gerenciar-banners"><h2>GERENCIAR BANNERS</h2>
<div class="tools"><button class="ibtn" id="bn-all" type="button">Prévia do carrossel</button></div>
<div style="margin-bottom:18px"><div class="count" style="margin-bottom:6px">Prévia</div><div id="bn-prev"></div></div>
<div class="adm"><form id="bn-form" autocomplete="off"><h2 id="bn-ft">Novo banner</h2>
<label>Título<input class="fld" name="titulo" maxlength="80" required></label>
<label>Subtítulo<input class="fld" name="subtitulo" maxlength="160"></label>
<label>Texto do botão<input class="fld" name="botaoTexto" maxlength="30" value="Ver ofertas"></label>
<label>Link do botão (https:// ou #todos)<input class="fld" name="link" value="#todos"></label>
<label>Imagem (upload)<input class="fld" name="arquivo" type="file" accept="image/*"></label><input type="hidden" name="imagem">
<label>Cor de fundo<input class="fld" name="corFundo" type="color" value="#0c0c0d"></label>
<label>Cor de destaque<input class="fld" name="corDestaque" type="color" value="#ff6a1a"></label>
<label>Cor do texto<input class="fld" name="corTexto" type="color" value="#f4f2ef"></label>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="ativo" checked> Banner ativo</label>
<div class="err" id="bn-err" role="alert"></div>
<div><button class="ibtn on" type="submit">Salvar banner</button> <button class="ibtn" type="button" id="bn-cancel" hidden>Cancelar</button></div></form>
<div id="bn-list"></div></div></section>
</main>
<script type="module" src="js/admin-init.js"></script>
</body>
</html>
